[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "ara1-financial-research-agent"
version = "0.1.0"
description = "ARA-1: Autonomous Financial Research Agent with Multi-Source Synthesis"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "Atif Khan", email = "atifkhan@example.com"}
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.setuptools.packages.find]
include = ["agent*", "tools*", "memory*", "synthesis*", "evaluation*", "config*"]
